name = "trefoil_audit"
version = "0.1.0"
defaultTargets = ["Trefoil", "TrefoilAudit", "Section2Reference", "Section3AReference", "Section3BReference"]
moreLeanArgs = ["-j", "1"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "49af9b7fd7e19db08a946b5bd08d1a5bc39dfd3d"

[[lean_lib]]
name = "Trefoil"

[[lean_lib]]
name = "TrefoilAudit"

[[lean_lib]]
name = "Section2Reference"
roots = ["SECTION2_Reference_Audit"]

[[lean_lib]]
name = "Section3AReference"
roots = [
  "SECTION3A_Reference_Audit",
  "experimental.Section3ARelativeMVStandalone",
  "experimental.Section3ACanonicalTopology",
  "experimental.Section3AExplicitHomology",
]

[[lean_lib]]
name = "Section3BReference"
roots = ["SECTION3B_Reference_Audit"]
